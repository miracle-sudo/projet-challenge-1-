<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  
  <title>Frontend Mentor | Interactive rating component</title>
  <link rel="stylesheet" href="style.css">
  <script src="java.js"></script>

  
</head>
<body>
    <div class="rating-card">

        <div class="star-container">

            <img src="images/icon-star.svg" alt="star">
        </div>

        <h1>How did we do?</h1>

         <p>
            Please let us know how we did with your support
            request. All feedback is appreciated to help us
            improve our offering!
        </p>

        <div class="rating-container">

            <button class="rating" data-roo ="1">1</button>
            <button class="rating" data-roo ="2">2</button>
            <button class="rating" data-roo ="3">3</button>
            <button class="rating" data-roo ="4">4</button>
            <button class="rating" data-roo ="5">5</button>

        </div>

        <button class="submit">SUBMIT</button>

    </div>
     <section class="container">
        <div class="thank-card">

            <!-- Illustration -->
            <img
                class="thank-you-image"
                src="images/illustration-thank-you.svg"
                alt="Thank you illustration"
            >

            <!-- Note sélectionnée -->
            <div class="selected-rating">
                You selected 4 out of 5
            </div>

            <!-- Titre -->
            <h1>Thank you!</h1>

            <!-- Texte -->
            <p>
                We appreciate you taking the time to give a rating.
                If you ever need more support, don't hesitate to
                get in touch!
            </p>

        </div>

      </section>
</body>
</html>
